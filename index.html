<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Society Maintenance Payment</title>
    <!-- Modern professional font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Required QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --primary: #1A56A0;
            --primary-dark: #123e75;
            --accent: #1E7E34;
            --accent-dark: #155d27;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 2rem 1rem;
            align-items: center;
        }

        main {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            line-height: 1.3;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            width: 100%;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background-color: var(--primary);
        }

        .step-group {
            margin-bottom: 1.5rem;
        }

        .step-group label {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }
        
        .step-badge {
            background-color: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 0.6rem;
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
        }

        select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            background-color: #f8fafc;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
            cursor: pointer;
        }

        select:focus, select:focus-visible {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 86, 160, 0.15);
        }

        .amount-display {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 1px solid #bbf7d0;
            padding: 1.25rem;
            border-radius: 12px;
            text-align: center;
            margin: 1.5rem 0 0 0;
        }

        .amount-display .label {
            font-size: 0.875rem;
            color: #166534;
            margin-bottom: 0.25rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .amount-display .value {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        .payment-section {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.4s ease, max-height 0.4s ease, margin-top 0.4s ease, padding-top 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .payment-section.active {
            opacity: 1;
            max-height: 1000px;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border);
        }

        .transaction-note {
            width: 100%;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.5rem;
            background: #f1f5f9;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        #qrcode-container {
            display: none; /* Shown on desktop via JS */
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        #qrcode {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 1rem;
            min-width: 284px;
            min-height: 284px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-instruction {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn:active:not(.disabled) {
            transform: scale(0.98);
        }

        .btn-pay {
            background-color: var(--accent);
            color: white;
            height: 56px;
            display: flex; /* Shown on mobile via JS */
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(30, 126, 52, 0.25);
            margin-bottom: 1.25rem;
        }

        .btn-pay:hover:not(.disabled) {
            background-color: var(--accent-dark);
            box-shadow: 0 6px 8px -1px rgba(30, 126, 52, 0.35);
        }

        .btn-pay.disabled {
            background-color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            pointer-events: none;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            width: 100%;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
            font-size: 0.875rem;
            padding: 0.875rem 0.5rem;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

    </style>
</head>
<body>

    <main>
        <header class="header">
            <h1 id="society-name-display">Society Name <span style="font-size: 1.25rem;">🏢</span></h1>
        </header>

        <section class="card">
            
            <div class="step-group">
                <label for="flat"><span class="step-badge">1</span> Select your Flat</label>
                <select id="flat">
                    <option value="" disabled selected>Select Flat</option>
                    <!-- Options populated by JS -->
                </select>
            </div>
            
            <div class="step-group">
                <label><span class="step-badge">2</span> Select Period</label>
                <div class="form-row">
                    <select id="month">
                        <option value="" disabled>Month</option>
                        <!-- Options populated by JS -->
                    </select>
                    <select id="year">
                        <option value="" disabled>Year</option>
                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>
            
            <div class="amount-display">
                <div class="label">Maintenance Amount</div>
                <div class="value" id="amount-display">₹0</div>
            </div>
            
            <div id="payment-section" class="payment-section">
                
                <div class="transaction-note" id="tn-display"></div>
                
                <div id="qrcode-container">
                    <div id="qrcode"></div>
                    <div class="qr-instruction">Scan with any UPI app</div>
                </div>
                
                <div id="pay-btn-container" style="width: 100%; display: none;">
                    <a href="#" id="pay-btn" class="btn btn-pay disabled">Pay Now</a>
                </div>
                
                <div class="action-buttons">
                    <button id="copy-btn" class="btn btn-secondary">🔗 Copy Link</button>
                    <button id="wa-btn" class="btn btn-secondary">💬 Share Details</button>
                </div>

            </div>
        </section>
    </main>

    <footer class="footer">
        For issues contact your society admin
    </footer>

    <script>
        // ==========================================
        // CONFIGURATION BLOCK - EDIT VALUES BELOW
        // ==========================================
        const CONFIG = {
            society_name: "Sunshine Apartments",
            upi_id: "sunshine.apts@upi",
            maintenance_amount: 2500,
            currency: "INR",
            flats: ["101", "102", "103", "201", "202", "203", "301", "302", "303"],
            // Add wings like: ["A-101", "A-102", "B-101", "B-102"]
        };
        // ==========================================
        // END CONFIGURATION BLOCK
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            
            // UI Elements
            const societyNameDisplay = document.getElementById('society-name-display');
            const amountDisplay = document.getElementById('amount-display');
            const flatSelect = document.getElementById('flat');
            const monthSelect = document.getElementById('month');
            const yearSelect = document.getElementById('year');
            const paymentSection = document.getElementById('payment-section');
            const tnDisplay = document.getElementById('tn-display');
            const payBtn = document.getElementById('pay-btn');
            const qrcodeContainer = document.getElementById('qrcode-container');
            const payBtnContainer = document.getElementById('pay-btn-container');

            // 1. Initialize Static Data
            societyNameDisplay.innerHTML = `${CONFIG.society_name} <span style="font-size: 1.3rem;">🏢</span>`;
            amountDisplay.textContent = `${CONFIG.currency} ${Number(CONFIG.maintenance_amount).toLocaleString('en-IN')}`;

            // 2. Populate Dropdowns
            // Flats
            CONFIG.flats.forEach(flat => {
                const opt = document.createElement('option');
                opt.value = flat;
                opt.textContent = flat;
                flatSelect.appendChild(opt);
            });

            // Months (using abbreviations to ensure transaction note stays under 50 chars)
            const months = [
                { val: "Jan", name: "January" }, { val: "Feb", name: "February" },
                { val: "Mar", name: "March" },   { val: "Apr", name: "April" },
                { val: "May", name: "May" },     { val: "Jun", name: "June" },
                { val: "Jul", name: "July" },    { val: "Aug", name: "August" },
                { val: "Sep", name: "September" },{ val: "Oct", name: "October" },
                { val: "Nov", name: "November" }, { val: "Dec", name: "December" }
            ];
            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.val;
                opt.textContent = m.name;
                monthSelect.appendChild(opt);
            });

            // Years
            const currentYear = new Date().getFullYear();
            [currentYear, currentYear + 1].forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = year;
                yearSelect.appendChild(opt);
            });

            // Set Defaults
            const currentMonthIndex = new Date().getMonth(); // 0-11
            monthSelect.selectedIndex = currentMonthIndex + 1; // +1 to skip the disabled "Month" placeholder
            yearSelect.value = currentYear;

            // 3. Environment Detection (Mobile vs Desktop)
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                qrcodeContainer.style.display = 'none';
                payBtnContainer.style.display = 'block';
            } else {
                qrcodeContainer.style.display = 'flex';
                payBtnContainer.style.display = 'none';
            }

            // 4. Core Logic Functions
            function getTransactionNote() {
                const flat = flatSelect.value;
                const month = monthSelect.value;
                const year = yearSelect.value;
                
                if (!flat || !month || !year) return "";
                
                // Format strictly required: Flat-[NUMBER]-[MONTH]-[YEAR]-Maintenance
                let tn = `Flat-${flat}-${month}-${year}-Maintenance`;
                
                // Absolute safeguard for 50 character limit on transaction note
                if (tn.length > 50) {
                    tn = tn.substring(0, 50);
                }
                
                return tn;
            }

            function getUpiLink(tn) {
                const pa = CONFIG.upi_id;
                const pn = encodeURIComponent(CONFIG.society_name);
                const am = CONFIG.maintenance_amount;
                const cu = CONFIG.currency;
                const encodedTn = encodeURIComponent(tn);
                
                return `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tn=${encodedTn}&cu=${cu}`;
            }

            let qrCodeObj = null;
            function generateQR(link) {
                const container = document.getElementById('qrcode');
                container.innerHTML = ""; // Clear existing
                
                if (typeof QRCode === 'undefined') {
                    container.innerHTML = "<p style='color:#dc2626; font-size:0.875rem; text-align:center; padding: 2rem 1rem;'>QR Library offline.<br>Please use the Copy Link button.</p>";
                    return;
                }
                
                try {
                    qrCodeObj = new QRCode(container, {
                        text: link,
                        width: 250,
                        height: 250,
                        colorDark : "#0f172a",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.M
                    });
                } catch(e) {
                    console.error("QR Code Generation Error:", e);
                }
            }

            // 5. UI Update Handler
            function updateUI() {
                const tn = getTransactionNote();
                
                if (tn) {
                    const upiLink = getUpiLink(tn);
                    
                    // Show Note
                    tnDisplay.textContent = `Txn Note: ${tn}`;
                    
                    // Setup Pay Button
                    payBtn.href = upiLink;
                    payBtn.classList.remove('disabled');
                    
                    // Generate QR
                    generateQR(upiLink);
                    
                    // Animate In
                    paymentSection.classList.add('active');
                } else {
                    // Hide if form incomplete
                    paymentSection.classList.remove('active');
                    payBtn.removeAttribute('href');
                    payBtn.classList.add('disabled');
                }
            }

            // 6. Event Listeners
            flatSelect.addEventListener('change', updateUI);
            monthSelect.addEventListener('change', updateUI);
            yearSelect.addEventListener('change', updateUI);

            document.getElementById('copy-btn').addEventListener('click', () => {
                const tn = getTransactionNote();
                if (!tn) return;
                
                const link = getUpiLink(tn);
                navigator.clipboard.writeText(link).then(() => {
                    const btn = document.getElementById('copy-btn');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = "✅ Copied!";
                    setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
                }).catch(() => {
                    alert("Failed to copy link. Please try again.");
                });
            });

            document.getElementById('wa-btn').addEventListener('click', () => {
                const flat = flatSelect.value;
                const monthName = monthSelect.options[monthSelect.selectedIndex].text;
                const year = yearSelect.value;
                
                if (!flat) return;
                
                const text = `I have paid maintenance for Flat ${flat} - ${monthName} ${year}. Please find the payment details: [UPI Ref will show in your bank statement]`;
                const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            });

        });
    </script>
</body>
</html>
