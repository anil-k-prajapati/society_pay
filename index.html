<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Society Maintenance Payment</title>
    <!-- Modern professional font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Required QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Link separated styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <header class="header">
            <h1 id="society-name-display">Terra Gold - Belmac Riverside <span style="font-size: 1.15rem;">🏢</span></h1>
        </header>

        <section class="card">
            
            <div class="step-group">
                <label for="floor"><span class="step-badge">1</span> Select Floor & Flat</label>
                <div class="form-row">
                    <select id="floor">
                        <option value="" disabled selected>Floor</option>
                        <!-- Options populated by JS -->
                    </select>
                    <select id="flat">
                        <option value="" disabled selected>Flat No</option>
                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>
            
            <div class="step-group">
                <label><span class="step-badge">2</span> Select Period</label>
                <div class="form-row">
                    <select id="month">
                        <option value="" disabled>Month</option>
                        <!-- Options populated by JS -->
                    </select>
                    <select id="year">
                        <option value="" disabled>Year</option>
                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>
            
            <div id="payment-section" class="payment-section">
                
                <div class="amount-display" style="width: 100%; margin-top: 0; margin-bottom: 1.5rem;">
                    <div class="label">Maintenance Amount</div>
                    <div class="value" id="amount-display">₹0</div>
                </div>

                <!-- Tabs Navigation -->
                <div class="tabs-list">
                    <button id="tab-pay" type="button" class="tab-trigger active">⚡ Pay Direct</button>
                    <button id="tab-qr" type="button" class="tab-trigger">📷 Scan QR</button>
                </div>

                <!-- Tab Content: Pay Direct -->
                <div id="tab-content-pay" style="width: 100%;">
                    <a href="#" id="pay-btn" class="btn btn-pay disabled" style="width: 100%;">Pay Now</a>
                </div>
                
                <!-- Tab Content: QR Scan -->
                <div id="tab-content-qr" style="width: 100%; display: none; margin-bottom: 1.25rem;">
                    <div id="qrcode-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                        <div id="qrcode"></div>
                        <div class="qr-instruction">Scan with any UPI app</div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button id="copy-btn" class="btn btn-secondary">🔗 Copy Link</button>
                    <button id="wa-btn" class="btn btn-secondary">💬 Share Details</button>
                </div>

            </div>
        </section>
    </main>

    <footer class="footer">
        For issues contact your society admin
    </footer>

    <!-- Reference separated application logic -->
    <script defer src="app.js"></script>
</body>
</html>
